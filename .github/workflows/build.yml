name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleRelease

    - name: Generate signing key
      run: |
        keytool -genkeypair \
          -v \
          -keystore nightfilter.keystore \
          -alias nightfilter \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nightfilter123 \
          -keypass nightfilter123 \
          -dname "CN=NightFilter, OU=NightFilter, O=NightFilter, L=Empalme, ST=Sonora, C=MX"

    - name: Sign APK
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
        "$APKSIGNER" sign \
          --ks nightfilter.keystore \
          --ks-key-alias nightfilter \
          --ks-pass pass:nightfilter123 \
          --key-pass pass:nightfilter123 \
          --out app/build/outputs/apk/release/app-release.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Verify APK
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NightFilter-APK
        path: app/build/outputs/apk/release/app-release.apk
